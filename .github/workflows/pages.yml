name: Publish the tutorial site

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Markdown in tutorial/ is the source of truth; the HTML is compiled here
# and never committed, so the two cannot drift apart.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs rather than floating tags, so a
      # compromised or retagged release cannot silently change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the one dependency
        run: pip install -r requirements.txt

      - name: Compile the site
        run: python3 scripts/build_site.py _site

      - name: Fail if a page went missing
        run: |
          count=$(find _site -name '*.html' | wc -l | tr -d ' ')
          echo "generated $count HTML pages"
          # 11 chapters + 3 appendices + index. Fewer means a source file was
          # renamed without updating scripts/build_site.py.
          if [ "$count" -ne 15 ]; then
            echo "::error::expected 15 pages, got $count"
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
